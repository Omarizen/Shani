<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #2c3e50, #6c3483);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 20px;
      max-width: 90%;
      margin: auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    img {
      width: 100%;
      max-width: 350px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8em;
    }

    p {
      font-size: 1.1em;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍎 ShaniI</h1>
    <img src="images/product.jpg" alt="Product Image">
    <p><strong>Price:</strong> $10.00</p>
    <p><strong>Expires:</strong> 2025-12-31</p>
    <p><strong>Notes:</strong> Fresh and delicious</p>
  </div>
</body>
</html>
